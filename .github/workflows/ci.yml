name: MCP CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run worker:check
      - run: npm run worker:dry-run
      - run: npm pack --dry-run

  # Every green push to main deploys the public Developer Worker to
  # mcp.convokit.app. Needs the CLOUDFLARE_API_TOKEN repository secret
  # (Cloudflare "Edit Cloudflare Workers" token for the account in wrangler.jsonc).
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require the Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret to deploy the Worker."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Deploy the Worker
        run: npx wrangler deploy --var RELEASE_SHA:${{ github.sha }}
      - name: Smoke test the live Developer endpoint
        run: node scripts/smoke.mjs https://mcp.convokit.app/mcp/developer
      - name: Check /health reports this commit
        run: |
          for attempt in 1 2 3 4 5 6; do
            release=$(curl -fsS https://mcp.convokit.app/health | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).release")
            [ "$release" = "${{ github.sha }}" ] && { echo "Live release $release"; exit 0; }
            echo "Live release is $release, waiting for ${{ github.sha }}"
            sleep 10
          done
          exit 1
